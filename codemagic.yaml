workflows:
  ios-release:
    name: iOS Release
    triggering:
      events:
        - push
    integrations:
      app_store_connect: Codemagic
    instance_type: mac_mini_m2
    environment:
      flutter: 3.41.8
      xcode: latest
      cocoapods: default
    scripts:
      - name: Disable Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Set up keychain and provisioning profiles
        script: |
          keychain initialize
          keychain add-certificates --certificate certs/wobbly_credentials.p12 --certificate-password 1234
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp certs/*.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
      - name: Build ipa for distribution
        script: |
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
