<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Wobbly Bottle: Party Game — İndir / Download</title>
  <meta name="description" content="Wobbly Bottle: Doğruluk mu Cesaret mi Parti Oyunu! App Store ve Google Play'den hemen ücretsiz indir." />
  <meta property="og:title" content="Wobbly Bottle: Party Game 🍾🎉" />
  <meta property="og:description" content="Şişeyi çevir, eğlenceyi başlat! App Store ve Google Play'de ücretsiz." />
  <meta property="og:image" content="https://61mertkoc-cpu.github.io/wobbly-bottle/assets/bent_0_0.png" />
  <meta property="og:url" content="https://61mertkoc-cpu.github.io/wobbly-bottle/" />
  <meta name="theme-color" content="#050817" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #050817;
      background-image:
        radial-gradient(circle at 50% 18%, rgba(0, 242, 254, 0.22) 0%, transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(255, 8, 68, 0.18) 0%, transparent 50%),
        linear-gradient(180deg, #050817 0%, #091428 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 18px;
      overflow-x: hidden;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(10, 24, 40, 0.88);
      border: 2px solid rgba(0, 242, 254, 0.45);
      border-radius: 32px;
      padding: 32px 24px 28px;
      text-align: center;
      box-shadow:
        0 0 40px rgba(0, 242, 254, 0.2),
        0 20px 50px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(14px);
      position: relative;
    }

    .logo-wrap {
      width: 130px;
      height: 130px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.25) 0%, rgba(5, 23, 37, 0.9) 75%);
      border: 2.5px solid #00f2fe;
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: wobble 2.6s ease-in-out infinite;
    }

    .logo-wrap img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0, 242, 254, 0.5));
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(-10deg) scale(1); }
      50% { transform: rotate(10deg) scale(1.05); }
    }

    h1 {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #ffcc00;
      text-shadow: 0 0 16px rgba(255, 204, 0, 0.55);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.4px;
      color: #00f2fe;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .desc {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.78);
      line-height: 1.45;
      margin-bottom: 26px;
    }

    .btn-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }

    .store-btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 16px;
      width: 100%;
      padding: 16px 20px;
      border-radius: 20px;
      text-decoration: none;
      color: #ffffff;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      position: relative;
    }

    .store-btn:active {
      transform: scale(0.97);
    }

    .store-btn.ios {
      background: linear-gradient(135deg, #121c2d 0%, #09101d 100%);
      border: 2.5px solid #00f2fe;
      box-shadow: 0 0 22px rgba(0, 242, 254, 0.3);
    }

    .store-btn.android {
      background: linear-gradient(135deg, #1b0f24 0%, #0f091c 100%);
      border: 2.5px solid #ff0844;
      box-shadow: 0 0 22px rgba(255, 8, 68, 0.3);
    }

    .store-btn.recommended {
      border-color: #ffcc00;
      box-shadow: 0 0 28px rgba(255, 204, 0, 0.55);
    }

    .badge {
      position: absolute;
      top: -11px;
      right: 16px;
      background: #ffcc00;
      color: #000000;
      font-size: 10px;
      font-weight: 900;
      padding: 3px 10px;
      border-radius: 10px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    .icon-box {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-box svg {
      width: 36px;
      height: 36px;
    }

    .btn-text {
      text-align: left;
      flex: 1;
    }

    .btn-small {
      font-size: 11px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      display: block;
      margin-bottom: 2px;
    }

    .btn-big {
      font-size: 20px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.4px;
      display: block;
    }

    .arrow {
      font-size: 20px;
      font-weight: 900;
      color: #ffcc00;
    }

    .features {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    .pill {
      font-size: 11px;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #ffcc00;
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.45);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-wrap">
      <img src="assets/bent_0_0.png" alt="Wobbly Bottle" />
    </div>

    <h1>WOBBLY BOTTLE</h1>
    <div class="subtitle" id="subText">EĞLENCELİ PARTİ OYUNU</div>
    <p class="desc" id="descText">
      Şişeyi çevir, doğruluk mu cesaret mi seç ve partiyi ateşle! Hemen telefonuna ücretsiz indir:
    </p>

    <div class="btn-list" id="btnContainer">
      <!-- iOS App Store Button -->
      <a
        href="https://apps.apple.com/app/id6794894168"
        class="store-btn ios"
        id="iosBtn"
        target="_blank"
        rel="noopener"
      >
        <div class="icon-box">
          <svg viewBox="0 0 384 512" fill="#00f2fe">
            <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
          </svg>
        </div>
        <div class="btn-text">
          <span class="btn-small" id="iosSmall">İNDİR / DOWNLOAD</span>
          <span class="btn-big">App Store (iOS)</span>
        </div>
        <span class="arrow">➔</span>
      </a>

      <!-- Google Play Button -->
      <a
        href="https://play.google.com/store/apps/details?id=com.wobblybottle.game"
        class="store-btn android"
        id="androidBtn"
        target="_blank"
        rel="noopener"
      >
        <div class="icon-box">
          <svg viewBox="0 0 512 512" fill="#ff0844">
            <path d="M325.3 234.3L104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6l-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-14.3 18-46.5-1.2-60.8zM104.6 499l280.8-161.2-60.1-60.1L104.6 499z"/>
          </svg>
        </div>
        <div class="btn-text">
          <span class="btn-small" id="andSmall">İNDİR / GET IT ON</span>
          <span class="btn-big">Google Play (Android)</span>
        </div>
        <span class="arrow">➔</span>
      </a>
    </div>

    <div class="features">
      <span class="pill">🍾 5 Efsane Şişe</span>
      <span class="pill">🔥 6 Parti Paketi</span>
      <span class="pill">🌍 4 Dil Desteği</span>
    </div>

    <div class="footer">
      © 2026 Wobbly Bottle Party Game
    </div>
  </div>

  <script>
    (function() {
      var ua = navigator.userAgent || navigator.vendor || window.opera;
      var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      var isAndroid = /android/i.test(ua);

      var iosBtn = document.getElementById('iosBtn');
      var androidBtn = document.getElementById('androidBtn');
      var container = document.getElementById('btnContainer');

      var lang = (navigator.language || 'tr').toLowerCase();
      var isTR = lang.indexOf('tr') === 0;

      if (!isTR) {
        document.getElementById('subText').textContent = 'FUNNY PARTY GAME';
        document.getElementById('descText').textContent = 'Spin the bottle, pick Truth or Dare, and start the party! Download free now:';
        document.getElementById('iosSmall').textContent = 'DOWNLOAD ON THE';
        document.getElementById('andSmall').textContent = 'GET IT ON';
      }

      var badgeText = isTR ? '✨ CİHAZIN İÇİN ÖNERİLEN' : '✨ RECOMMENDED FOR YOU';

      if (isIOS) {
        iosBtn.classList.add('recommended');
        var b = document.createElement('div');
        b.className = 'badge';
        b.textContent = badgeText;
        iosBtn.appendChild(b);
      } else if (isAndroid) {
        androidBtn.classList.add('recommended');
        var b2 = document.createElement('div');
        b2.className = 'badge';
        b2.textContent = badgeText;
        androidBtn.appendChild(b2);
        // Put Android button first on Android devices
        container.insertBefore(androidBtn, iosBtn);
      }
    })();
  </script>
</body>
</html>
